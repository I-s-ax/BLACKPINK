<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLACKPINK Gallery</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo">BLACKPINK</div>

  <button class="menu" type="button">
    ☰
  </button>
</header>

<main>

  <p class="subtitle">BLACKPINK</p>
  <h1>GALERÍA</h1>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Buscar álbum..."
  >

  <div class="actions">

    <button
      class="action light"
      id="favoritesButton"
      type="button"
    >
      Favoritos
    </button>
    

    <button
      class="action"
      id="createButton"
      type="button"
    >
      Crear Álbum
    </button>

    <button
      class="action light"
      type="button"
    >
      Eliminar Álbumes
    </button>
    
    
    

    <button
      class="action light"
      type="button"
    >
      Editar Álbumes
    </button>

  </div>

  <div class="categories" id="categories">

  <button
    class="category active"
    data-category="Todas"
    type="button"
  >
    Todas
  </button>

  <button
    class="category new-category"
    id="newCategoryButton"
    type="button"
  >
    + Nueva categoría
  </button>

</div>

  <div id="message" class="message"></div>

  <section class="gallery" id="gallery">
    <div class="loading">
      Cargando álbumes...
    </div>
  </section>
  <section
  id="favoritePhotosSection"
  style="display:none"
>

  <h2>
    Fotos favoritas
  </h2>

  <div
    class="gallery"
    id="favoritePhotosGrid"
  ></div>

</section>

</main>

<footer>
  BLACKPINK PRIVATE GALLERY
<!-- VISTA DEL ÁLBUM -->

<div
  id="albumView"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:#fff;
    z-index:999;
    overflow:auto;
  "
>

  <div style="padding:20px">

    <button
      id="backToAlbums"
      class="action light"
      type="button"
    >
      ← Volver
    </button>

    <h2 id="albumTitle">
      Álbum
    </h2>

    <p id="albumInfo"></p>

    <input
      id="photoUploader"
      type="file"
      multiple
      accept="image/*"
      style="display:none"
    >

    <button
      id="uploadPhotosButton"
      class="action"
      type="button"
    >
      + Subir fotos
    </button>
    
    <div
  style="
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  "
>

  <button
    id="favoriteAlbumButton"
    class="action light"
    type="button"
  >
    ♡ Álbum favorito
  </button>
  <button
    id="editAlbumButton"
    class="action light"
    type="button"
  >
    Editar álbum
  </button>

  <button
    id="deleteAlbumButton"
    class="action light"
    type="button"
  >
    Eliminar álbum
  </button>
</div>

    <div
      id="photoGrid"
      style="
        margin-top:20px;
        display:grid;
        gap:12px;
        grid-template-columns:
        repeat(auto-fill,minmax(140px,1fr));
      "
    ></div>

  </div>

</div>
  
  
</footer>


<!-- CREAR ÁLBUM -->

<div class="modal" id="createModal">

  <div class="modal-box">

    <h2>Crear álbum</h2>

    <form id="createForm">

      <div class="field">
        <label for="albumName">
          Nombre
        </label>

        <input
          id="albumName"
          maxlength="100"
          required
          placeholder="Ej. Concierto en Seúl"
        >
      </div>

      <div class="field">

        <label for="albumCategory">
          Categoría
        </label>

        <select id="albumCategory" required>
  <option value="">
    Selecciona una categoría
  </option>
</select>

      </div>

      <div class="field">

        <label for="albumDescription">
          Descripción
        </label>

        <textarea
          id="albumDescription"
          placeholder="Descripción opcional..."
        ></textarea>

      </div>

      <div class="modal-actions">

        <button
          class="btn cancel"
          id="cancelCreate"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn save"
          id="saveAlbum"
          type="submit"
        >
          Crear
        </button>

      </div>

    </form>

  </div>

</div>

<!-- CREAR CATEGORÍA -->

<div class="modal" id="categoryModal">

  <div class="modal-box">

    <h2>Nueva categoría</h2>

    <form id="categoryForm">

      <div class="field">

        <label for="categoryName">
          Nombre
        </label>

        <input
          id="categoryName"
          maxlength="50"
          required
          autocomplete="off"
          placeholder="Ej. Conciertos"
        >

      </div>

      <div class="modal-actions">

        <button
          class="btn cancel"
          id="cancelCategory"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn save"
          id="saveCategory"
          type="submit"
        >
          Crear
        </button>

      </div>

    </form>

  </div>

</div>


<!-- VISOR DE FOTOS -->

<div class="photo-viewer" id="photoViewer">

  <button
    class="viewer-close"
    id="closeViewer"
    type="button"
    aria-label="Cerrar"
  >
    ×
  </button>

  <button
    class="viewer-nav viewer-prev"
    id="previousPhoto"
    type="button"
    aria-label="Anterior"
  >
    ‹
  </button>

  <div class="viewer-content">

    <img
      id="viewerImage"
      src=""
      alt="Fotografía"
    >

    <div class="viewer-bottom">

      <span id="viewerCounter"></span>

      <div class="viewer-actions">
      
        <button
  id="fullscreenPhoto"
  type="button"
  aria-label="Pantalla completa"
>
  ⛶
</button>

       <button
  id="setCoverPhoto"
  type="button"
>
  ♡ Portada
</button>


        
      

        <button
          id="favoritePhoto"
          type="button"
        >
          ♡ Favorito
        </button>

        <button
          id="deletePhoto"
          class="danger"
          type="button"
        >
          Eliminar
        </button>

      </div>

    </div>

  </div>

  <button
    class="viewer-nav viewer-next"
    id="nextPhoto"
    type="button"
    aria-label="Siguiente"
  >
    ›
  </button>

</div>



<!-- EDITAR ÁLBUM -->

<div class="modal" id="editAlbumModal">

  <div class="modal-box">

    <h2>Editar álbum</h2>

    <form id="editAlbumForm">

      <div class="field">
        <label for="editAlbumName">
          Nombre
        </label>

        <input
          id="editAlbumName"
          maxlength="100"
          required
        >
      </div>

      <div class="field">
        <label for="editAlbumCategory">
          Categoría
        </label>

        <select
          id="editAlbumCategory"
          required
        ></select>
      </div>

      <div class="field">
        <label for="editAlbumDescription">
          Descripción
        </label>

        <textarea
          id="editAlbumDescription"
        ></textarea>
      </div>

      <div class="modal-actions">

        <button
          class="btn cancel"
          id="cancelEditAlbum"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn save"
          id="saveEditAlbum"
          type="submit"
        >
          Guardar
        </button>

      </div>

    </form>

  </div>
</div>


<!-- ADMINISTRAR CATEGORÍA -->

<div
  class="modal"
  id="manageCategoryModal"
>
  <div class="modal-box">

    <h2>Editar categoría</h2>

    <form id="manageCategoryForm">

      <div class="field">
        <label for="manageCategoryName">
          Nombre
        </label>

        <input
          id="manageCategoryName"
          maxlength="50"
          required
          autocomplete="off"
        >
      </div>

      <div class="modal-actions">

        <button
          class="btn cancel"
          id="cancelManageCategory"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn category-delete"
          id="deleteCategory"
          type="button"
        >
          Eliminar
        </button>

        <button
          class="btn save"
          id="saveCategoryChanges"
          type="submit"
        >
          Guardar
        </button>

      </div>

    </form>

  </div>
</div>
<script src="app.js" defer></script>

</body>
</html>
