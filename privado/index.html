<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLACKPINK Gallery</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --black: #080808;
  --pink: #ff73ac;
  --light-pink: #ffc0da;
  --white: #fff;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
  background:
    linear-gradient(
      145deg,
      #ffd1e3 0%,
      #ff9dc4 45%,
      #ff71aa 100%
    );
}

button,
input,
select,
textarea {
  font: inherit;
}

/* HEADER */

header {
  height: 72px;
  padding: 0 20px;
  background: var(--black);
  color: white;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-weight: 900;
  letter-spacing: 3px;
  font-size: 22px;
}

.menu {
  border: 0;
  background: none;
  color: white;
  font-size: 28px;
}

/* CONTENIDO */

main {
  width: min(1100px, 100%);
  margin: auto;
  padding: 42px 18px 80px;
}

.subtitle {
  margin: 0;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 5px;
}

h1 {
  margin: 4px 0 28px;
  font-size: clamp(48px, 12vw, 88px);
  line-height: .9;
}

/* BUSCADOR */

.search {
  width: 100%;
  padding: 16px 18px;
  border: 0;
  outline: none;
  border-radius: 16px;
  background: rgba(255,255,255,.82);
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

/* ACCIONES */

.actions {
  display: flex;
  gap: 9px;
  margin: 15px 0;
  overflow-x: auto;
  padding-bottom: 4px;
}

.actions button,
.categories button {
  border: 0;
  cursor: pointer;
  white-space: nowrap;
}

.action {
  padding: 12px 16px;
  border-radius: 14px;
  background: #111;
  color: white;
  font-weight: 700;
}

.action.light {
  background: rgba(255,255,255,.75);
  color: #111;
}

/* CATEGORÍAS */

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 5px 0 22px;
}

.category {
  padding: 9px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,.55);
}

.category.active {
  background: #111;
  color: white;
}

/* ÁLBUMES */

.gallery {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}

.album {
  overflow: hidden;
  border-radius: 19px;
  background: rgba(255,255,255,.62);
  box-shadow: 0 10px 25px rgba(0,0,0,.12);
  cursor: pointer;
}

.cover {
  aspect-ratio: 1 / 1;
  background:
    linear-gradient(
      135deg,
      #111,
      #4a2334
    );

  display: flex;
  align-items: center;
  justify-content: center;

  color: #ff8cbb;
  font-size: 38px;
  font-weight: 900;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.album-info {
  padding: 13px;
}

.album-name {
  margin: 0 0 5px;
  font-weight: 800;
  font-size: 15px;
}

.album-count {
  margin: 0;
  font-size: 12px;
  opacity: .6;
}

/* VACÍO */

.empty {
  grid-column: 1 / -1;
  padding: 45px 20px;
  text-align: center;
  background: rgba(255,255,255,.35);
  border-radius: 20px;
}

.empty strong {
  display: block;
  margin-bottom: 7px;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;
  background: rgba(0,0,0,.65);
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(430px, 100%);
  max-height: 90vh;
  overflow-y: auto;

  padding: 23px;
  border-radius: 22px;
  background: #fff;
}

.modal-box h2 {
  margin-top: 0;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 700;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 13px;

  border: 1px solid #ddd;
  border-radius: 12px;
  outline: none;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 20px;
}

.btn {
  border: 0;
  padding: 12px 17px;
  border-radius: 12px;
  font-weight: 700;
}

.btn.cancel {
  background: #eee;
}

.btn.save {
  background: #111;
  color: white;
}

.message {
  margin: 15px 0;
  font-size: 14px;
}

.error {
  color: #a00022;
}

.loading {
  text-align: center;
  padding: 30px;
}

footer {
  padding: 35px 20px;
  text-align: center;
  background: #080808;
  color: #aaa;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">BLACKPINK</div>

  <button class="menu" type="button">
    ☰
  </button>
</header>

<main>

  <p class="subtitle">BLACKPINK</p>
  <h1>GALERÍA</h1>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Buscar álbum..."
  >

  <div class="actions">

    <button
      class="action light"
      id="favoritesButton"
      type="button"
    >
      Favoritos
    </button>

    <button
      class="action"
      id="createButton"
      type="button"
    >
      Crear Álbum
    </button>

    <button
      class="action light"
      type="button"
    >
      Eliminar Álbumes
    </button>

    <button
      class="action light"
      type="button"
    >
      Editar Álbumes
    </button>

  </div>

  <div class="categories" id="categories">

  <button
    class="category active"
    data-category="Todas"
    type="button"
  >
    Todas
  </button>

  <button
    class="category new-category"
    id="newCategoryButton"
    type="button"
  >
    + Nueva categoría
  </button>

</div>

  <div id="message" class="message"></div>

  <section class="gallery" id="gallery">
    <div class="loading">
      Cargando álbumes...
    </div>
  </section>

</main>

<footer>
  BLACKPINK PRIVATE GALLERY
</footer>


<!-- CREAR ÁLBUM -->

<div class="modal" id="createModal">

  <div class="modal-box">

    <h2>Crear álbum</h2>

    <form id="createForm">

      <div class="field">
        <label for="albumName">
          Nombre
        </label>

        <input
          id="albumName"
          maxlength="100"
          required
          placeholder="Ej. Concierto en Seúl"
        >
      </div>

      <div class="field">

        <label for="albumCategory">
          Categoría
        </label>

        <select id="albumCategory" required>
  <option value="">
    Selecciona una categoría
  </option>
</select>

      </div>

      <div class="field">

        <label for="albumDescription">
          Descripción
        </label>

        <textarea
          id="albumDescription"
          placeholder="Descripción opcional..."
        ></textarea>

      </div>

      <div class="modal-actions">

        <button
          class="btn cancel"
          id="cancelCreate"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn save"
          id="saveAlbum"
          type="submit"
        >
          Crear
        </button>

      </div>

    </form>

  </div>

</div>

<!-- CREAR CATEGORÍA -->

<div class="modal" id="categoryModal">

  <div class="modal-box">

    <h2>Nueva categoría</h2>

    <form id="categoryForm">

      <div class="field">

        <label for="categoryName">
          Nombre
        </label>

        <input
          id="categoryName"
          maxlength="50"
          required
          autocomplete="off"
          placeholder="Ej. Conciertos"
        >

      </div>

      <div class="modal-actions">

        <button
          class="btn cancel"
          id="cancelCategory"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn save"
          id="saveCategory"
          type="submit"
        >
          Crear
        </button>

      </div>

    </form>

  </div>

</div>

<script>

const API = "/privado/api";

const gallery =
  document.getElementById("gallery");

const searchInput =
  document.getElementById("search");

const createModal =
  document.getElementById("createModal");

const createForm =
  document.getElementById("createForm");

const message =
  document.getElementById("message");

let currentCategory = "Todas";
let favoritesOnly = false;
let categoryList = [];


/* API */

async function api(path, options = {}) {

  const response = await fetch(
    API + path,
    {
      credentials: "same-origin",
      ...options
    }
  );

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error(
      "Respuesta inválida del servidor."
    );
  }

  if (!response.ok || data.ok === false) {
    throw new Error(
      data.error || "Error del servidor."
    );
  }

  return data;
}


/* CARGAR ÁLBUMES */

async function loadAlbums() {

  gallery.innerHTML =
    '<div class="loading">Cargando...</div>';

  message.textContent = "";

  const params =
    new URLSearchParams();

  const search =
    searchInput.value.trim();

  if (search) {
    params.set("search", search);
  }

  if (currentCategory !== "Todas") {
    params.set(
      "category",
      currentCategory
    );
  }

  if (favoritesOnly) {
    params.set("favorites", "1");
  }

  try {

    const data = await api(
      "/albums?" + params.toString()
    );

    renderAlbums(data.albums);

  } catch (error) {

    gallery.innerHTML = "";

    message.className =
      "message error";

    message.textContent =
      error.message;
  }
}


/* MOSTRAR ÁLBUMES */

function renderAlbums(albums) {

  gallery.innerHTML = "";

  if (!albums.length) {

    gallery.innerHTML = `
      <div class="empty">
        <strong>No hay álbumes todavía</strong>
        Crea tu primer álbum para comenzar.
      </div>
    `;

    return;
  }

  for (const album of albums) {

    const card =
      document.createElement("article");

    card.className = "album";

    let cover;

    if (album.cover_key) {

      const imageURL =
        `${API}/images/${
          encodeURIComponent(album.cover_key)
        }`;

      cover = `
        <div class="cover">
          <img
            src="${imageURL}"
            alt=""
            loading="lazy"
          >
        </div>
      `;

    } else {

      cover = `
        <div class="cover">
          BP
        </div>
      `;
    }

    card.innerHTML = `
      ${cover}

      <div class="album-info">

        <p class="album-name"></p>

        <p class="album-count">
          ${album.photo_count || 0}
          foto${
            Number(album.photo_count) === 1
              ? ""
              : "s"
          }
        </p>

      </div>
    `;

    card.querySelector(
      ".album-name"
    ).textContent = album.name;

    card.addEventListener(
      "click",
      () => openAlbum(album.id)
    );

    gallery.appendChild(card);
  }
}


/* CREAR ÁLBUM */

document
  .getElementById("createButton")
  .addEventListener("click", () => {

    createModal.classList.add("show");

    setTimeout(() => {
      document
        .getElementById("albumName")
        .focus();
    }, 100);

  });


document
  .getElementById("cancelCreate")
  .addEventListener("click", () => {

    createModal.classList.remove("show");

  });


createModal.addEventListener(
  "click",
  event => {

    if (event.target === createModal) {
      createModal.classList.remove("show");
    }

  }
);


createForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const saveButton =
      document.getElementById("saveAlbum");

    const name =
      document
        .getElementById("albumName")
        .value
        .trim();

    const category =
      document
        .getElementById("albumCategory")
        .value;

    const description =
      document
        .getElementById("albumDescription")
        .value
        .trim();

    if (!name) {
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Creando...";

    try {

      await api(
        "/albums",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            name,
            category,
            description
          })
        }
      );

      createForm.reset();

      createModal.classList.remove(
        "show"
      );

      await loadAlbums();

    } catch (error) {

      alert(error.message);

    } finally {

      saveButton.disabled = false;
      saveButton.textContent = "Crear";

    }

  }
);

/* =========================================
   CATEGORÍAS DINÁMICAS
========================================= */

async function loadCategories() {

  try {

    const data =
      await api("/categories");

    categoryList =
      data.categories || [];

    renderCategories();
    renderCategorySelect();

  } catch (error) {

    console.error(
      "Error cargando categorías:",
      error
    );

  }
}


function renderCategories() {

  const container =
    document.getElementById("categories");

  container.innerHTML = "";


  // TODAS

  const allButton =
    document.createElement("button");

  allButton.type = "button";
  allButton.className =
    "category" +
    (
      currentCategory === "Todas"
        ? " active"
        : ""
    );

  allButton.textContent = "Todas";

  allButton.addEventListener(
    "click",
    () => {

      currentCategory = "Todas";

      renderCategories();
      loadAlbums();

    }
  );

  container.appendChild(allButton);


  // CATEGORÍAS DEL USUARIO

  for (const category of categoryList) {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "category" +
      (
        currentCategory === category.name
          ? " active"
          : ""
      );

    button.textContent =
      category.name;

    button.addEventListener(
      "click",
      () => {

        currentCategory =
          category.name;

        renderCategories();
        loadAlbums();

      }
    );

    container.appendChild(button);
  }


  // NUEVA CATEGORÍA

  const newButton =
    document.createElement("button");

  newButton.type = "button";
  newButton.className =
    "category new-category";

  newButton.textContent =
    "+ Nueva categoría";

  newButton.addEventListener(
    "click",
    openCategoryModal
  );

  container.appendChild(newButton);
}


function renderCategorySelect() {

  const select =
    document.getElementById(
      "albumCategory"
    );

  select.innerHTML = `
    <option value="">
      Selecciona una categoría
    </option>
  `;

  for (const category of categoryList) {

    const option =
      document.createElement("option");

    option.value =
      category.name;

    option.textContent =
      category.name;

    select.appendChild(option);
  }
}


/* MODAL */

const categoryModal =
  document.getElementById(
    "categoryModal"
  );

const categoryForm =
  document.getElementById(
    "categoryForm"
  );


function openCategoryModal() {

  categoryModal.classList.add(
    "show"
  );

  setTimeout(() => {

    document
      .getElementById("categoryName")
      .focus();

  }, 100);
}


function closeCategoryModal() {

  categoryModal.classList.remove(
    "show"
  );

  categoryForm.reset();
}


document
  .getElementById("cancelCategory")
  .addEventListener(
    "click",
    closeCategoryModal
  );


categoryModal.addEventListener(
  "click",
  event => {

    if (event.target === categoryModal) {
      closeCategoryModal();
    }

  }
);


/* CREAR */

categoryForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const input =
      document.getElementById(
        "categoryName"
      );

    const button =
      document.getElementById(
        "saveCategory"
      );

    const name =
      input.value.trim();

    if (!name) {
      return;
    }

    button.disabled = true;
    button.textContent =
      "Creando...";

    try {

      await api(
        "/categories",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            name
          })
        }
      );

      closeCategoryModal();

      await loadCategories();

    } catch (error) {

      alert(error.message);

    } finally {

      button.disabled = false;
      button.textContent = "Crear";

    }

  }
);

/* FAVORITOS */

document
  .getElementById("favoritesButton")
  .addEventListener(
    "click",
    event => {

      favoritesOnly =
        !favoritesOnly;

      event.currentTarget
        .classList.toggle(
          "action",
          favoritesOnly
        );

      event.currentTarget
        .classList.toggle(
          "light",
          !favoritesOnly
        );

      loadAlbums();
    }
  );


/* BÚSQUEDA */

let searchTimer;

searchInput.addEventListener(
  "input",
  () => {

    clearTimeout(searchTimer);

    searchTimer =
      setTimeout(loadAlbums, 300);

  }
);


/* ABRIR ÁLBUM */

function openAlbum(id) {

  /*
    En el siguiente paso esta función
    abrirá el álbum y permitirá subir
    fotografías.
  */

  console.log(
    "Abrir álbum:",
    id
  );
}


/* INICIAR */

async function init() {
  await loadCategories();
  await loadAlbums();
}

init();

</script>

</body>
</html>
